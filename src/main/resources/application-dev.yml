# Perfil dev: H2 en memoria (modo PostgreSQL), sin necesidad de servidor de BD.
# Activar con: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# o SPRING_PROFILES_ACTIVE=dev
spring:
  datasource:
    url: jdbc:h2:mem:ticketflowdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.tucv.ticketflow: DEBUG
